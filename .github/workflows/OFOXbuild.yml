name: OrangeFox - Build
on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'Source branch'
        required: true
        default: 'fox_12.1'  # Changed from OrangeFox-12.1
        type: choice
        options:
          - fox_12.1
          - fox_11.0
      DEVICE_TREE_URL:
        description: 'Device tree address'
        required: true
        default: 'https://github.com/sshJovian/device_oneplus_CPH2487'
      DEVICE_TREE_BRANCH:
        description: 'Device branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Device tree location'
        required: true
        default: 'device/oneplus/CPH2487'
      DEVICE_NAME:
        description: 'Model name'
        required: true
        default: 'CPH2487'
      DEVICE_MAKEFILE:
        description: 'Device makefile name'
        required: true
        default: 'fox_CPH2487.mk'
      BUILD_TARGET:
        description: 'Build Target Partition'
        required: true
        default: 'vendor_boot'  # Changed from recovery
        type: choice
        options:
          - boot
          - recovery
          - vendor_boot
      RECOVERY_INSTALLER:
        description: 'Include recovery installer zip'
        required: false

      - name: Fix Kernel Path
  run: |
    # Ensure kernel is in correct location
    if [ -f "device/oneplus/CPH2487/prebuilt/kernel" ]; then
      echo "Kernel found in prebuilt directory"
      chmod +x device/oneplus/CPH2487/prebuilt/kernel
    else
      echo "ERROR: Kernel not found!"
      exit 1
    fi
        default: 'true'
        type: boolean
      RECOVERY_TAR:
        description: 'Recovery to tar for Samsung'
        required: false
        default: 'false'
        type: boolean
