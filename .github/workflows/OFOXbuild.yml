name: OrangeFox - Build
on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'Source branch'
        required: true
        default: 'fox_12.1'
        type: choice
        options:
          - fox_12.1
          - fox_11.0
      DEVICE_TREE_URL:
        description: 'Device tree address'
        required: true
        default: 'https://github.com/sshJovian/device_oneplus_CPH2487'
      DEVICE_TREE_BRANCH:
        description: 'Device branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Device tree location'
        required: true
        default: 'device/oneplus/CPH2487'
      DEVICE_NAME:
        description: 'Model name'
        required: true
        default: 'CPH2487'
      DEVICE_MAKEFILE:
        description: 'Device makefile name'
        required: true
        default: 'fox_CPH2487.mk'
      BUILD_TARGET:
        description: 'Build Target Partition'
        required: true
        default: 'recovery'
        type: choice
        options:
          - boot
          - recovery
          - vendor_boot
      RECOVERY_INSTALLER:
        description: 'Include recovery installer zip'
        required: false
        default: 'true'
        type: boolean
      RECOVERY_TAR:
        description: 'Recovery to tar for Samsung'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    name: Build OrangeFox Recovery for ${{ github.event.inputs.DEVICE_NAME }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Display Inputs
        run: |
          echo "::group::Build Configuration"
          echo "Device: ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}"
          echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
          echo "Include Recovery Installer: ${{ github.event.inputs.RECOVERY_INSTALLER }}"
          echo "::endgroup::"

      - name: Clean Environment & Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y upgrade
          git clone https://gitlab.com/OrangeFox/misc/scripts
          cd scripts
          sudo bash setup/android_build_env.sh
          cd ..

      - name: Setup Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Initialize & Sync OrangeFox Source
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          cd ${GITHUB_WORKSPACE}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}

      - name: Clone Device Tree
        run: |
          cd ${GITHUB_WORKSPACE}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          rm -rf ./${{ github.event.inputs.DEVICE_PATH }}
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}

      - name: Clone Common Device Tree
        run: |
          cd ${GITHUB_WORKSPACE}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          git clone https://github.com/sshJovian/device_oneplus_sm8475-common -b main device/oneplus/sm8475-common

      - name: Clone Prebuilt Kernel
        run: |
          cd ${GITHUB_WORKSPACE}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          git clone https://github.com/sshJovian/device_oneplus_CPH2487-prebuilt -b main device/oneplus/CPH2487/prebuilt

      - name: Clone Vendor Tree
        run: |
          cd ${GITHUB_WORKSPACE}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          git clone https://github.com/sshJovian/vendor_oneplus_2487 -b main vendor/oneplus/2487

      - name: Fix Kernel Path & Permissions
        run: |
          cd ${GITHUB_WORKSPACE}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          if [ -f "device/oneplus/CPH2487/prebuilt/kernel" ]; then
            echo "✅ Kernel found"
            chmod +x device/oneplus/CPH2487/prebuilt/kernel
          else
            echo "❌ Kernel not found!"
            exit 1
          fi
          if [ -f "device/oneplus/CPH2487/prebuilt/dtbo.img" ]; then
            echo "✅ DTBO found"
          else
            echo "⚠️ DTBO not found"
          fi

      - name: Build OrangeFox Recovery
        run: |
          cd ${GITHUB_WORKSPACE}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch fox_${{ github.event.inputs.DEVICE_NAME }}-eng
          make -j$(nproc --all) ${{ github.event.inputs.BUILD_TARGET }}image

      - name: Check Build Output
        id: check
        run: |
          cd ${GITHUB_WORKSPACE}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          if [ -f "out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img" ]; then
            echo "✅ Build successful!"
            echo "FILE_PATH=${GITHUB_WORKSPACE}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
            echo "BUILD_STATUS=success" >> $GITHUB_ENV
          elif [ -f "out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.img" ]; then
            echo "✅ Build successful (alternative path)!"
            echo "FILE_PATH=${GITHUB_WORKSPACE}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
            echo "BUILD_STATUS=success" >> $GITHUB_ENV
          else
            echo "❌ Build failed - output not found"
            echo "BUILD_STATUS=failed" >> $GITHUB_ENV
            exit 1
          fi
          ls -la out/target/product/${{ github.event.inputs.DEVICE_NAME }}/ || true

      - name: Rename Recovery Image
        if: env.BUILD_STATUS == 'success'
        run: |
          cd ${{ env.FILE_PATH }}
          if [ "${{ github.event.inputs.BUILD_TARGET }}" = "recovery" ]; then
            if [ -f "recovery.img" ]; then
              mv recovery.img OrangeFox-${{ github.event.inputs.DEVICE_NAME }}.img
            elif [ -f "OrangeFox*.img" ]; then
              mv OrangeFox*.img OrangeFox-${{ github.event.inputs.DEVICE_NAME }}.img
            fi
            echo "RECOVERY_FILE=OrangeFox-${{ github.event.inputs.DEVICE_NAME }}.img" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.BUILD_TARGET }}" = "boot" ]; then
            mv boot.img OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-boot.img
            echo "RECOVERY_FILE=OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-boot.img" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.BUILD_TARGET }}" = "vendor_boot" ]; then
            mv vendor_boot.img OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-vendor_boot.img
            echo "RECOVERY_FILE=OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-vendor_boot.img" >> $GITHUB_ENV
          fi

      - name: Include Recovery Installer
        if: env.BUILD_STATUS == 'success' && github.event.inputs.RECOVERY_INSTALLER == 'true'
        run: |
          cd ${{ env.FILE_PATH }}
          wget https://github.com/kinguser981/recovery-installer/releases/download/11256427880/recovery-installer.zip
          unzip recovery-installer.zip
          mv ${{ env.RECOVERY_FILE }} OrangeFox-${{ github.event.inputs.DEVICE_NAME }}.img
          zip -ur recovery-installer.zip OrangeFox-${{ github.event.inputs.DEVICE_NAME }}.img
          echo "INSTALLER_ZIP=recovery-installer.zip" >> $GITHUB_ENV

      - name: Upload to Release
        if: env.BUILD_STATUS == 'success'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.FILE_PATH }}/${{ env.RECOVERY_FILE }}
            ${{ env.FILE_PATH }}/${{ env.INSTALLER_ZIP }}
          name: OrangeFox Recovery for ${{ github.event.inputs.DEVICE_NAME }}
          tag_name: OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_number }}
          draft: false
          prerelease: true
        continue-on-error: true
