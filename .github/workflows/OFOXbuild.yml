name: OrangeFox - Build
on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'Source branch'
        required: true
        default: 'fox_12.1'
        type: choice
        options:
          - fox_12.1
          - fox_11.0
      DEVICE_TREE_URL:
        description: 'Device tree address'
        required: true
        default: 'https://github.com/sshJovian/device_oneplus_CPH2487'
      DEVICE_TREE_BRANCH:
        description: 'Device branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Device tree location'
        required: true
        default: 'device/oneplus/CPH2487'
      DEVICE_NAME:
        description: 'Model name'
        required: true
        default: 'CPH2487'
      DEVICE_MAKEFILE:
        description: 'Device makefile name'
        required: true
        default: 'fox_CPH2487.mk'
      BUILD_TARGET:
        description: 'Build Target Partition'
        required: true
        default: 'vendor_boot'
        type: choice
        options:
          - boot
          - recovery
          - vendor_boot
      RECOVERY_INSTALLER:
        description: 'Include recovery installer zip'
        required: false
        default: 'true'
        type: boolean
      RECOVERY_TAR:
        description: 'Recovery to tar for Samsung'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean Environment & Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libxml2-utils make python3 python3-repo zip zlib1g-dev openjdk-11-jdk

      - name: Setup Build User
        run: |
          sudo useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD:ALL" | sudo tee -a /etc/sudoers

      - name: Clone OrangeFox Sync Script
        run: |
          git clone https://gitlab.com/OrangeFox/misc/scripts.git
          cp scripts/sync.sh .

      - name: Initialize & Sync OrangeFox Source
        run: |
          bash sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }}

      - name: Clone Device Tree
        run: |
          git clone --depth=1 ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}

      - name: Clone Common Device Tree (sm8475-common)
        run: |
          git clone --depth=1 https://github.com/sshJovian/device_oneplus_sm8475-common -b main device/oneplus/sm8475-common

      - name: Clone Prebuilt Kernel
        run: |
          git clone --depth=1 https://github.com/sshJovian/device_oneplus_CPH2487-prebuilt -b main device/oneplus/CPH2487/prebuilt

      - name: Clone Vendor Tree
        run: |
          git clone --depth=1 https://github.com/sshJovian/vendor_oneplus_2487 -b main vendor/oneplus/2487

      - name: Fix Kernel Path
        run: |
          # Ensure kernel is in correct location
          if [ -f "device/oneplus/CPH2487/prebuilt/kernel" ]; then
            echo "✅ Kernel found in prebuilt directory"
            chmod +x device/oneplus/CPH2487/prebuilt/kernel
            ls -la device/oneplus/CPH2487/prebuilt/
          else
            echo "❌ ERROR: Kernel not found!"
            exit 1
          fi

      - name: Build OrangeFox Recovery
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch fox_${{ github.event.inputs.DEVICE_NAME }}-eng
          make -j$(nproc --all) ${{ github.event.inputs.BUILD_TARGET }}image

      - name: Set Output Variables
        id: vars
        run: |
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Check Recovery Output
        run: |
          if [ -f "out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img" ]; then
            echo "✅ Build successful! Recovery image found."
            ls -la out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
          else
            echo "❌ Build failed! Recovery image not found."
            exit 1
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
            out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.zip
          name: OrangeFox Recovery for ${{ github.event.inputs.DEVICE_NAME }}
          tag_name: OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_number }}
          draft: false
          prerelease: true
        if: success()
