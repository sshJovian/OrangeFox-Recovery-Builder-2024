name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: 'fox_12.1'
        type: choice
        options:
          - fox_12.1
          - fox_11.0
      DEVICE_TREE_URL:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/sshJovian/device_oneplus_CPH2487'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: '13'
      DEVICE_PATH:
        description: 'Device Path (relative to workspace root)'
        required: true
        default: 'device/oneplus/CPH2487'
      DEVICE_NAME:
        description: 'Device Name (must match PRODUCT_DEVICE in fox_*.mk)'
        required: true
        default: 'udon'
      DEVICE_MAKEFILE:
        description: 'Device Makefile Name (without .mk)'
        required: true
        default: 'fox_CPH2487'
      BUILD_TARGET:
        description: 'Build Target Partition'
        required: true
        default: 'recovery'
        type: choice
        options:
          - recovery
          - boot
          - vendor_boot

jobs:
  build:
    name: Build OrangeFox Recovery
    runs-on: ubuntu-20.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Clean Environment & Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libwxgtk3.0-gtk3-dev libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 repo

      - name: Setup Build User
        run: |
          git config --global user.name "OrangeFox Builder"
          git config --global user.email "builder@orangefox.tech"

      - name: Initialize OrangeFox Manifest
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/OrangeFox_sync
          cd ${GITHUB_WORKSPACE}/OrangeFox_sync
          repo init -u https://gitlab.com/OrangeFox/sync.git -b ${{ github.event.inputs.MANIFEST_BRANCH }} --depth=1
          
      - name: Sync OrangeFox Source
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox_sync
          repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device Tree
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox_sync
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} \
            -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} \
            ${{ github.event.inputs.DEVICE_PATH }} \
            --depth=1

      - name: Clone Common Device Tree (sm8475-common)
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox_sync
          git clone https://github.com/sshJovian/device_oneplus_sm8475-common \
            -b 13 \
            device/oneplus/sm8475-common \
            --depth=1

      - name: Clone Prebuilt Kernel
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox_sync
          git clone https://github.com/sshJovian/device_oneplus_CPH2487-prebuilt \
            -b 13 \
            device/oneplus/CPH2487-prebuilt \
            --depth=1

      - name: Clone Vendor Tree
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox_sync
          git clone https://github.com/sshJovian/vendor_oneplus_2487 \
            -b 13 \
            vendor/oneplus/CPH2487 \
            --depth=1

      - name: Fix BoardConfig - Replace sm8350 with sm8475
        run: |
          # The device tree BoardConfig.mk incorrectly references sm8350-common
          # but the actual common tree is sm8475-common - fix it here
          BOARDCONFIG="${GITHUB_WORKSPACE}/OrangeFox_sync/${{ github.event.inputs.DEVICE_PATH }}/BoardConfig.mk"
          sed -i 's|device/oneplus/sm8350-common/BoardConfigCommon.mk|device/oneplus/sm8475-common/BoardConfigCommon.mk|g' "$BOARDCONFIG"
          echo "Fixed BoardConfig.mk - verified:"
          grep "sm84" "$BOARDCONFIG"

      - name: Setup Build Environment
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox_sync
          set +e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=${{ github.event.inputs.DEVICE_NAME }}
          export LC_ALL="C"

      - name: Build OrangeFox Recovery
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox_sync
          set +e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=${{ github.event.inputs.DEVICE_NAME }}
          export LC_ALL="C"
          lunch ${{ github.event.inputs.DEVICE_MAKEFILE }}-eng
          make clean
          mka adbd ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)

      - name: Get Build Date & Output Info
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
          cd ${GITHUB_WORKSPACE}/OrangeFox_sync
          echo "OUT_DIR=out/target/product/${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV

      - name: Check Recovery Output
        run: |
          ls -la ${GITHUB_WORKSPACE}/OrangeFox_sync/${{ env.OUT_DIR }}/
          ls ${GITHUB_WORKSPACE}/OrangeFox_sync/${{ env.OUT_DIR }}/*.img || true
          ls ${GITHUB_WORKSPACE}/OrangeFox_sync/${{ env.OUT_DIR }}/OrangeFox*.zip || true

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            OrangeFox_sync/${{ env.OUT_DIR }}/OrangeFox*.zip
            OrangeFox_sync/${{ env.OUT_DIR }}/OrangeFox*.img
            OrangeFox_sync/${{ env.OUT_DIR }}/recovery.img
          name: OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            ## OrangeFox Recovery for OnePlus 11R (udon / CPH2487)
            
            **Build Date:** ${{ env.BUILD_DATE }}
            **Manifest:** ${{ github.event.inputs.MANIFEST_BRANCH }}
            **Device:** ${{ github.event.inputs.DEVICE_NAME }} (CPH2487)
            **Makefile:** ${{ github.event.inputs.DEVICE_MAKEFILE }}
            
            ### Repos used:
            - Device Tree: sshJovian/device_oneplus_CPH2487 @ 13
            - Common Tree: sshJovian/device_oneplus_sm8475-common @ 13
            - Prebuilt: sshJovian/device_oneplus_CPH2487-prebuilt @ 13
            - Vendor: sshJovian/vendor_oneplus_2487 @ 13
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
